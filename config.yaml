# web scrapping info
BASE_URL: "https://eu.wikibooks.org/wiki/"
URL_COMPLEMENT: "Sukaldaritza_liburua/Azala"
CATEGORY_PREFIX: "Kategoria:"
TECHNIQUES_CATEGORIES: ["Carpaccio", "Egosi", "Entsalada", "Erre", "Erregosi", "Frijitu", "Ketu", "Konfitatu", "Kremak", "Labekatu", "Marian", "Plantxan", "Sueztitu", "Zopak"]
