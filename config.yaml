# file folders paths & names
DATA_PATH: "data"
INGREDIENTS_FILE_NAME: "ingredients.csv"
RECIPES_FILE_NAME_TMP: "recipe_tmp.csv"
SIMILAR_RECIPES_FILE_NAME: "similar.csv"
SIMILAR_NEW_FILE_NAME: "similar_checked.csv"
RECIPES_COMPLETED: "recipe_complete_by_user.csv"
SUBGROUP_TERMS_FILE_NAME: "subgroups.csv"
