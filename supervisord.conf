[supervisord]
nodaemon=true

[program:ollama]
command=/usr/local/app/run_ollama.sh
autostart=true
autorestart=true
stderr_logfile=/var/log/ollama.err.log
stdout_logfile=/var/log/ollama.out.log

[program:jupyter]
command=jupyter notebook --ip=0.0.0.0 --no-browser --allow-root --NotebookApp.token=''
autostart=true
autorestart=true
stderr_logfile=/var/log/jupyter.err.log
stdout_logfile=/var/log/jupyter.out.log
